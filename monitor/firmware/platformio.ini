; TSP Revenue Monitor — ESP32-S3-N16R8 + TFT SPI 320x240
; build:  pio run
; flash:  pio run -t upload && pio device monitor
[platformio]
; โฟลเดอร์ซอร์สตั้งชื่อให้ตรงกับไฟล์ .ino เพื่อให้ Arduino IDE เปิดได้ด้วย
src_dir = tsp_monitor

[env:tsp-monitor]
platform         = espressif32@^6.7.0
board            = esp32-s3-devkitc-1
framework        = arduino
monitor_speed    = 115200
upload_speed     = 921600

; N16R8 = flash 16MB + PSRAM 8MB (OPI) — จำเป็นสำหรับ sprite 2 ชั้นที่ใช้ทำ fade
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions  = default_16MB.csv

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  -DLGFX_USE_V1

lib_deps =
  lovyan03/LovyanGFX@^1.1.16
  bblanchon/ArduinoJson@^7.1.0

; ---------------------------------------------------------------------------
; ตัวช่วยหาว่าจอเป็น driver ตัวไหน — วนแสดง ILI9341 / ST7789 x invert ON/OFF
;   pio run -e panel-probe -t upload && pio device monitor
; ใช้ขาชุดเดียวกับ env หลัก (อ่านจาก src/config.h ถ้ามี)
; ---------------------------------------------------------------------------
[env:panel-probe]
extends          = env:tsp-monitor
build_src_filter = -<*> +<../probe/panel_probe/panel_probe.cpp>
build_flags      = ${env:tsp-monitor.build_flags} -I tsp_monitor
lib_deps         = lovyan03/LovyanGFX@^1.1.16
